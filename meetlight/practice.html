<dialog id="about-dialog" aria-labelledby="about-title"><div class="dialog-head"><h2 id="about-title">這是一個可以練習的地方。</h2><button class="icon-button" id="close-about" aria-label="關閉說明">×</button></div><p>透過虛構的交友情境，嘗試邀請、表達界線、保護隱私，也練習尊重他人的選擇。</p><p>對話採預先設計的分支劇本。選擇不同回覆，會看見不同的情境發展與觀察重點；這些發展只是示例，真實的人可能有不同反應。</p><p>自由輸入不會由AI理解或評分，請搭配檢視提示自行回看。所有練習內容只留在目前頁面，重新整理後即清除；下載的行動卡由你自行保管。</p><p>本工具提供互動練習，不作心理診斷、人格評分或個人安全認證。你可以隨時跳過或結束。</p><button class="button primary" id="about-done">了解了</button></dialog>
<script>'use strict';
globalThis.MEET_SCENARIOS=[
{id:'pace',number:'01',title:'回得慢，也可以被理解。',short:'回覆壓力',description:'對方希望即時收到訊息，你想保留自己的生活節奏。',tags:['表達界線','回覆節奏'],person:'小安',avatar:'安',setting:'你們剛認識一週。今天工作忙，你到晚上才看到訊息。',skills:['說明自己的需要','給出可以做到的安排','面對追問仍保留選擇'],opening:'你怎麼都沒有回？是不是覺得我很無聊？',perspective:'等待回覆的人可能感到不確定；收到催促的人也可能需要空間。可以理解感受，同時說清楚自己做得到的聯繫方式。',stages:[
{choices:[
{text:'今天比較忙，剛看到訊息。我喜歡跟你聊天，但上班時沒辦法即時回覆。',reaction:'原來是這樣。我不太確定你什麼時候方便聊。',title:'把關心與時間界線一起說出來。',note:'你說明了自己的情況，沒有承諾隨時回覆。接下來可以提出自己做得到的安排。',branch:'clear'},
{text:'對不起，我之後一定隨時回你，別不開心。',reaction:'真的嗎？那我之後傳訊息就等你回囉。',title:'先看看這個承諾是否適合自己。',note:'你想安撫對方的心情，但「隨時回覆」可能超過你願意或能做到的程度。可以試著改成具體的時段。',branch:'promise'},
{text:'我忙我的，不用一直問吧。',reaction:'我只是想知道你怎麼了，這樣讓我有點不知道怎麼回。',title:'界線可以清楚，也可以保留交流。',note:'這句表達了不想被追問，但對方不容易知道你希望怎麼聯繫。若你願意繼續，可以說明自己的時間安排。',branch:'sharp'}]},
{prompt:{clear:'那你可以每晚固定陪我聊一個小時嗎？',promise:'你昨天說會隨時回，可是今天又等好久。',sharp:'那我是不是乾脆都不要傳給你了？'},choices:[
{text:'我沒辦法承諾固定時長。有空時我會回，也希望我們都能保留自己的時間。',reaction:'我知道你的意思了，我也想一下什麼節奏適合我。',title:'提出可持續的聯繫方式。',note:'你沒有否定對方的需要，也沒有為了維持關係答應做不到的事。對方是否接受，仍是對方的選擇。'},
{text:'好吧，只要你不生氣，我都配合。',reaction:'那就照這樣約定吧。',title:'答應之前，確認自己的意願。',note:'如果你其實不願意，這個安排可能累積壓力。可以把「怕對方生氣」和「我想怎麼聯繫」分開想。'},
{text:'我想先暫停聊天，等我們都整理好自己的期待再說。',reaction:'好，我先不繼續傳訊息。',title:'暫停也是可以提出的選擇。',note:'你可以停止互動，而不必把對方說服。若對方之後持續追問，可以再次表明界線並使用平台工具。'}]}],phrases:['我喜歡和你交流，但沒辦法即時回覆。','我能做到的是有空時再回，不承諾固定時長。','我想先暫停互動，請尊重我的選擇。']},
{id:'invite',number:'02',title:'邀請，可以留一點空間。',short:'提出邀約',description:'想約新朋友見面，也希望對方能自在決定。',tags:['清楚邀請','尊重選擇'],person:'小晴',avatar:'晴',setting:'你們在活動中聊得愉快，對方傳來一間咖啡店的照片。',skills:['提出具體且有選擇的邀請','不把沉默視為同意','接受調整或拒絕'],opening:'這家咖啡店看起來好棒，我一直想去看看。',perspective:'提出邀請可能需要勇氣；被邀請的人也需要確認時間與意願。給對方空間，不會讓邀請失去誠意。',stages:[
{choices:[

</script><script>'use strict';
(() => {

  }
  function renderHome() {
    return `<div class="wrap"><section class="hero"><div><p class="eyebrow">MEET LIGHT · 關係試駕所</p><h1>有些話，<br>可以先練習一次。</h1><p class="lead">在真正遇到之前，先試著回應。<br>從一則訊息開始，練習<strong>邀請、表達界線，<br>也尊重彼此的選擇。</strong></p><div class="hero-footer"><span><i class="dot"></i>每個情境約 3–5 分鐘</span><span><i class="dot"></i>不用留下姓名</span></div></div><div class="sample" aria-label="情境示例"><p class="sample-label">情境片段 / 回覆的節奏</p><div class="sample-bubble">「你怎麼都沒有回？<br>是不是覺得我很無聊？」</div><div class="sample-answer">我喜歡和你交流，<br>但上班時沒辦法即時回覆。</div><p class="sample-note">理解感受，也保留自己的時間。</p></div></section><section aria-labelledby="scenarios-heading"><div class="section-head"><h2 id="scenarios-heading">今天，想從哪個情境開始？</h2><p>${completed.size ? `本頁已完成 ${completed.size} / 4 個情境` : '沒有排名，依自己的步調練習。'}</p></div><div class="scenario-grid">${scenarios.map(s=>`<button type="button" class="scenario-card" data-start="${s.id}"><span class="scenario-number">${s.number}</span><span class="text"><span class="card-title" role="heading" aria-level="3">${esc(s.title)}${completed.has(s.id)?'<span class="completed-mark">已練習</span>':''}</span><p>${esc(s.description)}</p><span class="card-meta"><span>${s.tags.map(esc).join(' · ')}</span><span class="arrow" aria-hidden="true">↗</span></span></span></button>`).join('')}</div><p class="start-tip">全部角色與對話皆為虛構。練習只留在目前頁面，重新整理後清除；你可以隨時跳過。</p></section></div>`;
  }
  function renderPractice() {

      }
    }
    const response=!answer?`<div class="response-area"><div class="response-label"><span>如果是你，會怎麼回？</span><span>第 ${state.stage+1} / 2 回合</span></div><div class="choices">${s.stages[state.stage].choices.map((c,i)=>`<button type="button" class="choice" data-choice="${i}"><span class="choice-index">${String(i+1).padStart(2,'0')}</span><span>${esc(c.text)}</span><span class="choice-arrow" aria-hidden="true">↗</span></button>`).join('')}</div><button type="button" class="custom-toggle" id="custom-toggle" aria-expanded="${state.custom}" aria-controls="custom-form">${state.custom?'收起自由回覆':'也可以用自己的話寫'}</button><form id="custom-form" class="custom-form" ${state.custom?'':'hidden'}><label for="custom-reply">我想這樣回覆</label><textarea id="custom-reply" maxlength="500" rows="3" placeholder="試著寫出你真正想說的話。" autocomplete="off"></textarea><p class="custom-note">自由回覆不會由AI理解或評分，送出後提供自行檢視提示。請勿填寫他人個資。</p><p id="custom-error" class="empty-error" role="alert" hidden>先寫下一句想說的話，再送出練習。</p><div class="input-foot"><span id="char-count">0 / 500</span><button type="submit" class="button primary small">送出練習</button></div></form></div>`:'';
    const feedback=answer?`<section class="feedback" aria-label="回覆觀察"><p class="feedback-label">停一下，回看這次互動</p><h3>${esc(answer.title)}</h3><p>${esc(answer.note)}</p><button type="button" id="perspective-button" class="perspective-toggle" aria-expanded="${state.perspective}" aria-controls="perspective-panel">${state.perspective?'收起另一個視角':'看另一個視角 ↗'}</button><div id="perspective-panel" class="perspective-box" ${state.perspective?'':'hidden'}><p>${esc(s.perspective)}</p></div><div class="practice-actions"><button type="button" class="button secondary" id="retry">換一種回覆</button><button type="button" class="button primary" id="next">${state.stage===0?'繼續下一回合':'整理我的行動卡'} <span aria-hidden="true">→</span></button></div></section>`:'';
    return `<div class="wrap"><div class="practice-top"><button type="button" class="button ghost small" data-home>← 返回情境</button><p class="eyebrow">PRACTICE ${s.number}</p></div><div class="practice-layout"><aside class="practice-side"><p class="eyebrow">${s.tags.map(esc).join(' · ')}</p><h1>${esc(s.title)}</h1><p class="desc">${esc(s.description)}</p><p class="side-label">這次可以練習</p><ul class="skill-list">${s.skills.map(v=>`<li>${esc(v)}</li>`).join('')}</ul><ol class="steps"><li class="${state.stage===0?'active':''}"><span class="step-circle">1</span>試著回覆</li><li class="${state.stage===1?'active':''}"><span class="step-circle">2</span>延續情境</li><li><span class="step-circle">3</span>帶走方法</li></ol><p class="side-note">這只是其中一種可能的發展。真實的人有不同反應，練習不會決定你或對方是什麼樣的人。</p></aside><div><section class="chat-panel" aria-label="虛構對話情境"><header class="chat-head"><span class="avatar" aria-hidden="true">${s.avatar}</span><span class="chat-name">${esc(s.person)}<small>虛構情境角色</small></span><span class="scene-tag">劇本示例</span></header><div class="chat-log" role="log" aria-label="練習對話" aria-live="polite">${log}</div>${response}${feedback}</section><p class="pause-note">你可以選擇暫停或返回情境，不需要勉強完成。</p></div></div></div>`;
  }
  function renderSummary() {
    const s=active();
    return `<section class="summary-wrap"><p class="eyebrow">TAKE IT WITH YOU</p><h1>把適合自己的話，帶走。</h1><p class="summary-intro">你完成了「${esc(s.short)}」情境。這是一段練習，不是對你的評分。<br>下面的句子可以依你的習慣修改，再下載留給自己。</p><div class="summary-pills">${s.tags.map(v=>`<span class="pill">${esc(v)}</span>`).join('')}<span class="pill">本頁已完成 ${completed.size} 個情境</span></div><div class="action-card" id="action-card"><p class="eyebrow">善行遇光計劃 · 我的行動卡</p><h2>${esc(s.short)}，我可以這樣做。</h2><p class="card-sub">保留自己的需要，也尊重對方的選擇。</p>${state.phrases.map((v,i)=>`<div class="phrase-field"><label for="phrase-${i}">${['01 / 說清楚自己的意思','02 / 留給彼此的界線','03 / 我可以採取的下一步'][i]}</label><textarea id="phrase-${i}" data-phrase="${i}" maxlength="600" rows="2">${esc(v)}</textarea></div>`).join('')}<div class="card-bottom">需要協助時：先停止不舒服的互動，保存必要資訊，使用原平台的封鎖或檢舉功能，或聯絡可信任的社群管理者。若有立即人身危險，尋求當地緊急協助。</div></div><div class="summary-actions"><button type="button" class="button primary" id="download">下載我的行動卡 <span aria-hidden="true">↓</span></button><button type="button" class="button secondary" id="next-scenario">${completed.size===scenarios.length?'再選一個情境':'練習另一個情境'} <span aria-hidden="true">→</span></button><button type="button" class="button ghost" id="restart">重練這個情境</button></div><section class="recap" aria-labelledby="recap-title"><h2 id="recap-title">回看我剛才的表達</h2>${state.answers.map((a,i)=>`<div class="recap-item"><small>第 ${i+1} 回合${a.custom?' · 自由回覆':''}</small><p>${esc(a.text)}</p></div>`).join('')}</section><p class="summary-end">內容只保留在目前頁面。下載後，請自行保管；未下載的內容會在重新整理後清除。</p></section>`;

  function render(){main.innerHTML=state.view==='home'?renderHome():state.view==='practice'?renderPractice():renderSummary();}
  document.addEventListener('click',e=>{
    const b=e.target.closest('button,a');if(!b)return;
    if(b.hasAttribute('data-home')){e.preventDefault();home();return;}
    if(b.dataset.start){start(b.dataset.start);return;}
    if(b.dataset.choice!==undefined){choose(Number(b.dataset.choice));return;}
    if(b.id==='custom-toggle'){state.custom=!state.custom;const form=document.getElementById('custom-form');form.hidden=!state.custom;b.setAttribute('aria-expanded',String(state.custom));b.textContent=state.custom?'收起自由回覆':'也可以用自己的話寫';if(state.custom)document.getElementById('custom-reply').focus();}
    else if(b.id==='perspective-button'){state.perspective=!state.perspective;document.getElementById('perspective-panel').hidden=!state.perspective;b.setAttribute('aria-expanded',String(state.perspective));b.textContent=state.perspective?'收起另一個視角':'看另一個視角 ↗';}
    else if(b.id==='retry'){state.answers.splice(state.stage);state.custom=false;state.perspective=false;render();main.querySelector('.choice')?.focus();}
    else if(b.id==='next')next();
    else if(b.id==='download')downloadCard();
    else if(b.id==='restart')start(state.scenario);
    else if(b.id==='next-scenario')home();
    else if(b.id==='about-button')document.getElementById('about-dialog').showModal();
    else if(b.id==='close-about'||b.id==='about-done')document.getElementById('about-dialog').close();
  });
  document.addEventListener('submit',e=>{if(e.target.id!=='custom-form')return;e.preventDefault();const field=document.getElementById('custom-reply');if(!customAnswer(field.value)){document.getElementById('custom-error').hidden=false;field.focus();}});
  document.addEventListener('input',e=>{if(e.target.id==='custom-reply'){document.getElementById('char-count').textContent=`${e.target.value.length} / 500`;document.getElementById('custom-error').hidden=true;}if(e.target.dataset.phrase!==undefined)state.phrases[Number(e.target.dataset.phrase)]=e.target.value;});
  document.getElementById('about-dialog').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.currentTarget.close();}});
  render();
})();
</script>
</body></html>
